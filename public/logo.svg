<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="100%" height="100%">
  <defs>
    <!-- Background / Icon Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E1B4B" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="icon" filter="url(#dropShadow)" transform="translate(0, 4)">
    <!-- Book Base / Pages Shadow Layer -->
    <path d="M 20,68 C 35,60 55,60 70,68 L 70,80 C 55,72 35,72 20,80 Z" fill="#4338CA" opacity="0.4" />
    <path d="M 70,68 C 85,60 105,60 120,68 L 120,80 C 105,74 85,74 70,82 Z" fill="#3730A3" opacity="0.4" />
    
    <!-- Open Book Main Pages -->
    <path d="M 18,35 C 36,26 54,29 70,36 L 70,76 C 54,69 36,66 18,75 Z" fill="url(#primaryGrad)" />
    <path d="M 70,36 C 86,29 104,26 122,35 L 122,75 C 104,66 86,69 70,76 Z" fill="url(#primaryGrad)" opacity="0.9" />
    
    <!-- Central Upload Arrow -->
    <g transform="translate(70, 42)">
      <path d="M 0,22 L 0,-12" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <path d="M -9,-3 L 0,-12 L 9,-3" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Reading Level Metric Bars (Left Page) -->
    <rect x="28" y="58" width="6" height="10" rx="3" fill="#FFFFFF" opacity="0.7" />
    <rect x="37" y="52" width="6" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="46" y="44" width="6" height="24" rx="3" fill="url(#highlightGrad)" />

    <!-- Text / Level Lines (Right Page) -->
    <line x1="86" y1="46" x2="110" y2="46" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="86" y1="54" x2="105" y2="54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="86" y1="62" x2="98" y2="62" stroke="url(#highlightGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- AI / Checkmark Node Badge -->
    <circle cx="98" cy="22" r="11" fill="url(#accentGrad)" />
    <path d="M 93,22 L 97,25 L 103,18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>